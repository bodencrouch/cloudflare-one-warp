name: Recover package publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38074235651
          pattern: packages-*
          path: dist/packages
          merge-multiple: true
      - name: Checksum completed packages
        env:
          PACKAGE_VERSION: 0.3.3
          CLOUDFLARE_ONE_WARP_SIGNING_KEY_PEM: ${{ secrets.CLOUDFLARE_ONE_WARP_SIGNING_KEY_PEM }}
          CLOUDFLARE_ONE_WARP_ALLOW_UNSIGNED: ${{ secrets.CLOUDFLARE_ONE_WARP_SIGNING_KEY_PEM == '' && '1' || '0' }}
        run: bash packaging/scripts/checksums.sh
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.3.3
        run: |
          gh release upload "$TAG" dist/packages/* --clobber
          gh release edit "$TAG" --draft=false --latest
          # Retire the empty releases created during the initial rename builds.
          for previous in v0.3.0 v0.3.1 v0.3.2; do
            if [[ "$previous" != "$TAG" ]] && [[ "$(gh release view "$previous" --json assets --jq '.assets | length' 2>/dev/null || echo missing)" == "0" ]]; then
              gh release edit "$previous" --draft=true
            fi
          done

      - name: Sync update manifest
        run: |
          node scripts/generate-update-manifest.mjs --version 0.3.3 --tag v0.3.3
          git config user.name "bodencrouch"
          git config user.email "221775936+bodencrouch@users.noreply.github.com"
          git add config/update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): sync update-manifest for v0.3.3 [skip ci]"
            git push origin HEAD:main
          fi
