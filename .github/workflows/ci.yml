name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      real_warp:
        description: Force Plane R real WARP smoke attempt
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plane-m:
    name: Plane M (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm deps
        run: npm ci --no-fund --no-audit --ignore-scripts

      - name: Syntax check
        run: npm run check
        shell: bash

      - name: Plane M unit + integration + OpenAPI
        env:
          WARP_CLI: ${{ github.workspace }}/scripts/mock-warp-cli.mjs
        run: npm run test:all
        shell: bash

      - name: Shellcheck (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning cloudflare-one-warp bin/cloudflare-one-warp bin/cloudflare-one-warp-tray bin/cloudflare-one-warp-gui
          shellcheck --severity=warning scripts/lib/common.sh scripts/install-local.sh scripts/uninstall-local.sh scripts/*.sh packaging/scripts/*.sh packaging/usr-bin-wrapper.sh packaging/usr-bin-alias-wrapper.sh packaging/appimage/AppRun
          chmod +x scripts/mock-warp-cli.sh scripts/mock-warp-cli.mjs scripts/ci-real-warp-smoke.sh

      - name: Stage packaging payload (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          npm run package:stage
          test -x dist/payload/usr/bin/cloudflare-one-warp
          test -f dist/payload/usr/lib/cloudflare-one-warp/server.js
          test -f dist/payload/usr/share/applications/cloudflare-one-warp.desktop

  ui-smoke:
    name: Playwright UI (mock)
    runs-on: ubuntu-latest
    needs: plane-m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci --no-fund --no-audit --ignore-scripts
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_USE_BUNDLED: "1"
        run: npx playwright install --with-deps chromium
      - name: UI smoke
        env:
          WARP_CLI: ${{ github.workspace }}/scripts/mock-warp-cli.mjs
          PLAYWRIGHT_USE_BUNDLED: "1"
        run: npm run test:ui

  package-smoke:
    name: Package build smoke
    runs-on: ubuntu-latest
    needs: plane-m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file rpm
          docker version
      - name: Build and verify deb/rpm/arch
        run: |
          export PACKAGE_VERSION="0.0.0-ci.${{ github.run_number }}"
          bash packaging/scripts/build-deb-rpm.sh all
          bash packaging/scripts/verify-packages.sh deb-rpm
        env:
          PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-packages-deb-rpm
          path: dist/packages/*
          retention-days: 7

  warp-real:
    name: Plane R real WARP smoke
    runs-on: ubuntu-latest
    needs: plane-m
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.real_warp)
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Real warp-cli network smoke
        run: |
          chmod +x scripts/ci-real-warp-smoke.sh scripts/mock-warp-cli.mjs
          bash scripts/ci-real-warp-smoke.sh

  qt-workers:
    name: Qt worker responsiveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install native Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libgbm1
          python -m pip install PyQt6==6.11.0 PyQt6-WebEngine==6.11.0
      - name: Background operations keep Qt responsive
        run: python scripts/ci-tray-workers.test.py
      - name: Native page authentication and navigation boundaries
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
        run: python scripts/ci-native-page.test.py
