# Flathub submission manifest
#
# Copy or symlink this file into a PR against https://github.com/flathub/flathub
# as: io.github.bodencrouch.CloudflareOneWarp.yml
#
# Update `tag` and `commit` on each release (or use FLATHUB_PAT automation).

app-id: io.github.bodencrouch.CloudflareOneWarp
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: cloudflare-one-warp

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-run/cloudflare-one-warp:create
  - --filesystem=xdg-cache/
  - --filesystem=xdg-config/
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.Notification

modules:
  - name: node
    buildsystem: simple
    build-commands:
      - |
        install -d /app/lib/node /app/bin
        tar -xJf node-v24.21.0-linux-x64.tar.xz -C /app/lib/node --strip-components=1
        ln -s /app/lib/node/bin/node /app/bin/node
    sources:
      - type: file
        url: https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
        sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
        dest-filename: node-v24.21.0-linux-x64.tar.xz

  - name: cloudflare-one-warp
    buildsystem: simple
    build-commands:
      - |
        install -d /app/lib/cloudflare-one-warp
        source_stage="$(mktemp -d)"
        bash packaging/scripts/stage-source.sh "$source_stage"
        cp -a "$source_stage"/server.js "$source_stage"/package.json "$source_stage"/public "$source_stage"/assets "$source_stage"/scripts "$source_stage"/bin "$source_stage"/lib "$source_stage"/config /app/lib/cloudflare-one-warp/
        rm -rf "$source_stage"
        cp cloudflare-one-warp /app/lib/cloudflare-one-warp/ 2>/dev/null || true
        chmod 0755 /app/lib/cloudflare-one-warp/bin/* /app/lib/cloudflare-one-warp/scripts/*.py /app/lib/cloudflare-one-warp/scripts/cloudflare-one-warp-nft-apply 2>/dev/null || true
        install -d /app/bin
        cat > /app/bin/cloudflare-one-warp <<'EOF'
        #!/bin/bash
        export PATH="/app/lib/node/bin:/app/bin:${PATH}"
        export CLOUDFLARE_ONE_WARP_NODE="/app/lib/node/bin/node"
        exec /app/lib/cloudflare-one-warp/bin/cloudflare-one-warp "$@"
        EOF
        chmod 0755 /app/bin/cloudflare-one-warp
        cat > /app/bin/cloudflare-one-warp-tray <<'EOF'
        #!/bin/bash
        export PATH="/app/lib/node/bin:/app/bin:${PATH}"
        exec /app/lib/cloudflare-one-warp/bin/cloudflare-one-warp-tray "$@"
        EOF
        chmod 0755 /app/bin/cloudflare-one-warp-tray
        install -Dm644 packaging/polkit/com.cloudflare.one.warp.policy \
          /app/share/polkit-1/actions/com.cloudflare.one.warp.policy
        install -Dm644 packaging/cloudflare-one-warp.desktop \
          /app/share/applications/io.github.bodencrouch.CloudflareOneWarp.desktop
        sed -i \
          -e 's|^Exec=.*|Exec=cloudflare-one-warp|' \
          -e 's|^Icon=.*|Icon=io.github.bodencrouch.CloudflareOneWarp|' \
          /app/share/applications/io.github.bodencrouch.CloudflareOneWarp.desktop
        install -Dm644 assets/cloudflare-one-warp.svg \
          /app/share/icons/hicolor/scalable/apps/io.github.bodencrouch.CloudflareOneWarp.svg
        install -Dm644 packaging/flatpak/metainfo.xml \
          /app/share/metainfo/io.github.bodencrouch.CloudflareOneWarp.metainfo.xml
    sources:
      - type: git
        url: https://github.com/bodencrouch/cloudflare-one-warp.git
        tag: v0.2.6
        commit: 14570b1c13b50a52ea3d867b7781c2f0c3da9019
